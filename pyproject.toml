[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "reasoning360"
version = "0.1.0"
description = "Reasoning360 extension for Verl"
readme = "README.md"
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
]
dependencies = [
    "verl",  # Assumes verl is installed in the environment
    "hydra-core",
    # Dependencies migrated from modified verl setup.py
    "langdetect",
    "immutabledict",
    "nltk",
    "polars",
    "nvitop",  # Moved from extras['gpu'] for convenience, or could be optional
]

[tool.setuptools.packages.find]
where = ["src"]
